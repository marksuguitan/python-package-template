name: Build & publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Consider using {{ cookiecutter.python_min_version }} or a dedicated workflow python version variable
      - name: Build wheel & sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel --outdir dist
      - name: Publish to GitHub Packages
        env:
          # Use {% raw %} to prevent Jinja2 from interpreting GitHub Actions syntax
          GITHUB_TOKEN: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
        run: |
          python -m pip install twine
          # Use {% raw %} here as well
          python -m twine upload \
            --repository-url "https://api.github.com/orgs/{% raw %}${{ github.repository_owner }}{% endraw %}/packages/pypi/upload" \
            dist/*